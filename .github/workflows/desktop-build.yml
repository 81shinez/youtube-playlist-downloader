name: Desktop build

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "licenses/**"
      - "docs/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "SECURITY.md"
      - ".gitignore"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "licenses/**"
      - "docs/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "SECURITY.md"
      - ".gitignore"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install build dependencies
        run: python -m pip install -e ".[build,dev]"
      - name: Run offline tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Check public source candidates
        run: python scripts/release_check.py
      - name: Build native desktop bundle
        run: |
          python scripts/prepare_ffmpeg.py --download
          python scripts/build_desktop.py --clean
      - name: Verify standalone Windows executable
        if: runner.os == 'Windows'
        run: python scripts/verify_onefile.py dist/YTMusicDownloader.exe --output build/onefile-verification
      - name: Check macOS console helper
        if: runner.os == 'macOS'
        run: dist/YTMusicDownloader.app/Contents/MacOS/ytm-worker --help
      - name: Check Linux console helper
        if: runner.os == 'Linux'
        run: dist/YTMusicDownloader/ytm-worker --help
      # No artifact upload or GitHub Release: corresponding-source review is pending.
      # See docs/DISTRIBUTION.md before adding any public binary upload step.
